<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubLifter — Live Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root{--bg:#080b12;--s:#0f1420;--s2:#161d2e;--s3:#0d1117;--bd:rgba(255,255,255,.07);--bhi:rgba(138,92,246,.45);--acc:#8a5cf6;--acc2:#6d28d9;--g:#22c55e;--r:#ef4444;--gold:#fbbf24;--b:#3b82f6;--t:#e8eaf0;--m:#5a6270;--m2:#8892a0;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--t);font-family:'DM Sans',sans-serif;min-height:100vh;padding:14px;}
        .wrap{max-width:1300px;margin:0 auto;}
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;margin-bottom:18px;background:var(--s);border:1px solid var(--bd);border-radius:14px;gap:10px;flex-wrap:wrap;}
        .brand{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:var(--acc);}
        .brand span{color:var(--t);}
        .nav-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .pill{font-size:.72rem;font-weight:600;color:var(--m2);text-decoration:none;padding:5px 11px;border-radius:20px;border:1px solid var(--bd);transition:.2s;white-space:nowrap;}
        .pill:hover,.pill.act{color:var(--acc);border-color:var(--bhi);background:rgba(138,92,246,.08);}
        .btn-db{font-size:.72rem;font-weight:600;color:var(--m2);padding:5px 11px;border-radius:10px;border:1px solid var(--bd);background:none;cursor:pointer;text-decoration:none;transition:.2s;}
        .btn-db:hover{color:var(--t);}
        .hamburger{display:none;background:none;border:1px solid var(--bd);color:var(--t);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:1.2rem;align-items:center;justify-content:center;flex-shrink:0;}
        .hamburger:hover{border-color:var(--acc);color:var(--acc);}
        .mobile-menu{display:none;flex-direction:column;gap:4px;background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:16px;}
        .mobile-menu.open{display:flex;}
        .mobile-menu a{font-size:.85rem;font-weight:600;color:var(--m2);text-decoration:none;padding:11px 14px;border-radius:10px;transition:.15s;}
        .mobile-menu a:hover,.mobile-menu a.act{color:var(--acc);background:rgba(138,92,246,.1);}
        .layout{display:grid;grid-template-columns:300px 1fr;gap:14px;}
        .panel{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:18px;}
        .panel h3{font-family:'Syne',sans-serif;font-size:.95rem;margin-bottom:4px;}
        .sub{font-size:.74rem;color:var(--m2);margin-bottom:14px;}
        .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
        .dot.on{background:var(--g);box-shadow:0 0 6px var(--g);}
        .dot.off{background:var(--m);}
        .drv{background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;}
        .drv:hover{border-color:var(--bhi);}
        .drv-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;display:flex;align-items:center;}
        .drv-car{font-size:.74rem;color:var(--m2);margin-top:3px;}
        .drv-badge{font-size:.65rem;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:auto;}
        .b-reg{background:rgba(34,197,94,.12);color:var(--g);border:1px solid rgba(34,197,94,.4);}
        .b-unreg{background:rgba(251,191,36,.12);color:var(--gold);border:1px solid rgba(251,191,36,.4);}
        #map{height:calc(100vh - 130px);min-height:480px;border-radius:16px;border:1px solid var(--bd);}
        .refresh-line{font-size:.72rem;color:var(--m);margin-top:12px;display:flex;align-items:center;gap:7px;}
        .pulse{width:7px;height:7px;border-radius:50%;background:var(--g);animation:p 2s infinite;}
        @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
        .empty{text-align:center;color:var(--m);font-size:.82rem;padding:22px 8px;}
        .leaflet-popup-content-wrapper{background:var(--s2);color:var(--t);border-radius:10px;}
        .leaflet-popup-tip{background:var(--s2);}
        @media(max-width:860px){
            .layout{grid-template-columns:1fr;}
            #map{height:380px;}
            .pills-desk{display:none;}
            .hamburger{display:flex;}
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="brand">Club<span>Lifter</span></div>
        <div class="nav-r">
            <div class="pills-desk" style="display:flex;gap:7px;">
                <a href="/admin/today"    class="pill">Today</a>
                <a href="/admin/tracking" class="pill act">Tracking</a>
                <a href="/admin/guestlist" class="pill">Guest List</a>
                <a href="/admin/packages" class="pill">Packages</a>
                <a href="/admin/drivers"  class="pill">Drivers</a>
                <a href="/admin/users"    class="pill">Users</a>
                <a href="/admin/clubs"    class="pill">Clubs</a>
                <a href="/admin/api"      class="pill">API</a>
            </div>
            <button class="hamburger" onclick="toggleMobileMenu()">☰</button>
            <a href="/" class="btn-db">← Dashboard</a>
        </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
        <a href="/admin/today">Today</a>
        <a href="/admin/tracking" class="act">Tracking</a>
        <a href="/admin/guestlist">Guest List</a>
        <a href="/admin/packages">Packages</a>
        <a href="/admin/drivers">Drivers</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/clubs">Clubs</a>
        <a href="/admin/api">API</a>
        <a href="/">← Dashboard</a>
    </div>

    <div class="layout">
        <div class="panel">
            <h3>Live Drivers</h3>
            <div class="sub">Vehicles reported by OneStepGPS</div>
            <div id="driverList"><div class="empty">Loading…</div></div>
            <div class="refresh-line"><span class="pulse"></span> Auto-refresh every 30s · <span id="count">0</span> online</div>
        </div>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function toggleMobileMenu(){var m=document.getElementById('mobileMenu');if(m)m.classList.toggle('open');}

const map = L.map('map').setView([36.1699,-115.1398], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© ClubLifter'}).addTo(map);

let markers = [];

function carIcon(registered){
    const color = registered ? '#22c55e' : '#fbbf24';
    return L.divIcon({
        className:'',
        html:`<div style="font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));">🚗</div><div style="width:10px;height:10px;border-radius:50%;background:${color};margin:-4px auto 0;box-shadow:0 0 8px ${color};"></div>`,
        iconSize:[30,40], iconAnchor:[15,38], popupAnchor:[0,-36]
    });
}

async function loadDrivers(fit=false){
    try{
        const res = await fetch('/api/live-drivers');
        const data = await res.json();
        if(data.error){ document.getElementById('driverList').innerHTML = `<div class="empty">⚠️ ${data.error}</div>`; return; }

        // clear old markers
        markers.forEach(m=>map.removeLayer(m)); markers=[];

        const list = document.getElementById('driverList');
        document.getElementById('count').innerText = data.count;
        if(!data.drivers.length){ list.innerHTML = '<div class="empty">No vehicles reporting location.</div>'; return; }

        list.innerHTML = '';
        const bounds = [];
        data.drivers.forEach(d=>{
            // marker
            const mk = L.marker([d.lat,d.lng],{icon:carIcon(d.registered)}).addTo(map);
            mk.bindPopup(`<b>${d.name}</b><br>${d.car||'<i>not registered</i>'}${d.phone?'<br>📞 '+d.phone:''}`);
            markers.push(mk);
            bounds.push([d.lat,d.lng]);

            // list card
            const card = document.createElement('div');
            card.className='drv';
            card.innerHTML = `
                <div class="drv-name"><span class="dot ${d.available===false?'off':'on'}"></span>${d.name}
                    <span class="drv-badge ${d.registered?'b-reg':'b-unreg'}">${d.registered?'Registered':'Unregistered'}</span>
                </div>
                <div class="drv-car">${d.car||'No car info'}</div>`;
            card.onclick = ()=>{ map.setView([d.lat,d.lng],14); mk.openPopup(); };
            list.appendChild(card);
        });

        if(fit && bounds.length){ map.fitBounds(bounds,{padding:[50,50],maxZoom:13}); }
    }catch(e){
        document.getElementById('driverList').innerHTML = `<div class="empty">⚠️ Failed to load</div>`;
    }
}

loadDrivers(true);
setInterval(()=>loadDrivers(false), 30000);
</script>
</body>
</html>
